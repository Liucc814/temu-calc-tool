<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><span class="lang zh">重量换算 | Temu跨境卖家工具</span><span class="lang en" style="display:none">Weight Converter | Cross-border Seller Tool</span></title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, sans-serif;
        }
        body {
            background-color: #f3f4f6;
            padding:30px 15px;
        }
        .container{
            max-width:600px;
            margin:0 auto;
        }
        .back{
            margin-bottom:20px;
        }
        .back a{
            color:#2563eb;
            text-decoration:none;
        }
        .card{
            background:#fff;
            padding:24px;
            border-radius:12px;
            box-shadow:0 1px 3px #0000001a;
        }
        .row{
            margin:16px 0;
        }
        label{
            display:block;
            margin-bottom:6px;
        }
        input{
            width:100%;
            padding:10px;
            border:1px solid #ddd;
            border-radius:6px;
            font-size:16px;
        }
        button{
            padding:10px 18px;
            background:#2563eb;
            color:#fff;
            border:none;
            border-radius:6px;
            cursor:pointer;
            font-size:16px;
        }
        #result{
            margin-top:20px;
            font-size:18px;
            font-weight:bold;
        }
        .tip{
            color:#666;
            font-size:14px;
            margin-top:6px;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- 返回首页 -->
    <div class="back">
        <a href="./index.html">
            <span class="lang zh">← 返回首页</span>
            <span class="lang en" style="display:none">← Back Home</span>
        </a>
    </div>

    <!-- 语言切换按钮 -->
    <div style="margin-bottom:20px;">
        <button onclick="switchLang('zh')">中文</button>
        <button onclick="switchLang('en')">English</button>
    </div>

    <div class="card">
        <h1>
            <span class="lang zh">重量换算 g ↔ lb</span>
            <span class="lang en" style="display:none">Weight Conversion g ↔ lb</span>
        </h1>
        <p class="tip">
            <span class="lang zh">1磅(lb) = 453.59237克(g)</span>
            <span class="lang en" style="display:none">1 lb = 453.59237 g</span>
        </p>

        <div class="row">
            <label>
                <span class="lang zh">输入克(g)</span>
                <span class="lang en" style="display:none">Enter Gram(g)</span>
            </label>
            <input type="number" class="trans-placeholder" id="gram" data-zh="请输入克数" data-en="Input gram value">
        </div>

        <div class="row">
            <label>
                <span class="lang zh">输入磅(lb)</span>
                <span class="lang en" style="display:none">Enter Pound(lb)</span>
            </label>
            <input type="number" class="trans-placeholder" id="lb" data-zh="请输入磅数" data-en="Input pound value">
        </div>

        <div id="result">
            <span class="lang zh">换算结果：</span>
            <span class="lang en" style="display:none">Result:</span>
            <span id="numPart"></span>
        </div>
    </div>
</div>

<script>
// 重量双向换算
const gramInput = document.getElementById('gram');
const lbInput = document.getElementById('lb');
const numPart = document.getElementById('numPart');

gramInput.oninput = function(){
    let g = Number(this.value);
    if(!isNaN(g) && g>0){
        let res = g / 453.59237;
        lbInput.value = res.toFixed(4);
        numPart.innerText = `${g} g = ${res.toFixed(4)} lb`;
    }else{
        lbInput.value = '';
        numPart.innerText = '';
    }
}
lbInput.oninput = function(){
    let lb = Number(this.value);
    if(!isNaN(lb) && lb>0){
        let res = lb * 453.59237;
        gramInput.value = res.toFixed(2);
        numPart.innerText = `${lb} lb = ${res.toFixed(2)} g`;
    }else{
        gramInput.value = '';
        numPart.innerText = '';
    }
}

// ========== 双语切换JS ==========
let currentLang = "en";
function switchLang(lang) {
    currentLang = lang;
    localStorage.setItem("webLang", lang);
    // 切换文字
    document.querySelectorAll(".lang").forEach(el => {
        el.style.display = el.classList.contains(lang) ? "inline" : "none";
    });
    // 切换输入框placeholder
    document.querySelectorAll(".trans-placeholder").forEach(input => {
        input.placeholder = input.dataset[lang];
    });
}
// 页面加载读取保存语言
window.onload = function () {
  const savedLang = localStorage.getItem("webLang");
  if(savedLang){
    currentLang = savedLang;
  }
  switchLang(currentLang);
}
</script>
</body>
</html>
