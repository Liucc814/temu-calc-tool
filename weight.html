<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重量换算 | Temu跨境卖家工具</title>
    <style>
        * {
            box-sizing: border-box;
            margin:0;
            padding:0;
            font-family:system-ui, sans-serif;
        }
        body {
            background-color:#f3f4f6;
            padding:30px 15px;
        }
        .container{
            max-width:600px;
            margin:0 auto;
        }
        .back{
            margin-bottom:20px;
        }
        .back a{
            color:#2563eb;
            text-decoration:none;
        }
        .card{
            background:#fff;
            padding:24px;
            border-radius:12px;
            box-shadow:0 2px 8px rgba(0,0,0,0.08);
        }
        h1{
            text-align:center;
            color:#1f2937;
            margin-bottom:24px;
            font-size:22px;
        }
        .row{
            margin:16px 0;
        }
        label{
            display:block;
            margin-bottom:6px;
            color:#444;
        }
        input,select{
            width:100%;
            padding:10px;
            font-size:16px;
            border:1px solid #ccc;
            border-radius:6px;
        }
        #result{
            margin-top:20px;
            padding:14px;
            background:#f0f7ff;
            border-radius:8px;
            font-size:17px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="back">
            <a href="index.html">← 返回工具箱首页</a>
        </div>
        <div class="card">
            <h1>重量换算 g / kg ↔ lb / oz</h1>
            <div class="row">
                <label>输入数值</label>
                <input id="num" type="number" placeholder="例如 3000">
            </div>
            <div class="row">
                <label>换算类型</label>
                <select id="type">
                    <option value="g2lb">克(g) → 磅(lb)</option>
                    <option value="lb2g">磅(lb) → 克(g)</option>
                    <option value="g2oz">克(g) → 盎司(oz)</option>
                    <option value="oz2g">盎司(oz) → 克(g)</option>
                    <option value="kg2lb">千克(kg) → 磅(lb)</option>
                    <option value="lb2kg">磅(lb) → 千克(kg)</option>
                </select>
            </div>
            <div id="result">换算结果将显示在这里</div>
        </div>
    </div>

<script>
function calc(){
    const n = parseFloat(document.getElementById('num').value);
    const t = document.getElementById('type').value;
    let res = "";
    if(isNaN(n)){
        res = "请输入有效数字";
    }else{
        //换算标准：1lb=453.59237g  1lb=16oz
        switch(t){
            case "g2lb": res = `${n} g = ${(n/453.59237).toFixed(4)} lb`;break;
            case "lb2g": res = `${n} lb = ${(n*453.59237).toFixed(2)} g`;break;
            case "g2oz": res = `${n} g = ${(n/28.3495).toFixed(4)} oz`;break;
            case "oz2g": res = `${n} oz = ${(n*28.3495).toFixed(2)} g`;break;
            case "kg2lb": res = `${n} kg = ${(n*2.20462).toFixed(4)} lb`;break;
            case "lb2kg": res = `${n} lb = ${(n/2.20462).toFixed(4)} kg`;break;
        }
    }
    document.getElementById("result").innerText = res;
}
document.getElementById('num').oninput = calc;
document.getElementById('type').onchange = calc;
</script>
</body>
</html>
