<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>货币估算 | Temu跨境卖家工具</title>
    <style>
        * {
            box-sizing: border-box;
            margin:0;
            padding:0;
            font-family:system-ui, sans-serif;
        }
        body {
            background-color:#f3f4f6;
            padding:30px 15px;
        }
        .container{
            max-width:600px;
            margin:0 auto;
        }
        .back{
            margin-bottom:20px;
        }
        .back a{
            color:#2563eb;
            text-decoration:none;
        }
        .card{
            background:#fff;
            padding:24px;
            border-radius:12px;
            box-shadow:0 2px 8px rgba(0,0,0,0.08);
        }
        h1{
            text-align:center;
            color:#1f2937;
            margin-bottom:24px;
            font-size:22px;
        }
        .row{
            margin:16px 0;
        }
        label{
            display:block;
            margin-bottom:6px;
            color:#444;
        }
        input,select{
            width:100%;
            padding:10px;
            font-size:16px;
            border:1px solid #ccc;
            border-radius:6px;
        }
        #result{
            margin-top:20px;
            padding:14px;
            background:#f0f7ff;
            border-radius:8px;
            font-size:17px;
        }
        .tip{
            margin-top:12px;
            font-size:13px;
            color:#666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="back">
            <a href="index.html">← 返回工具箱首页</a>
        </div>
        <div class="card">
            <h1>货币估算换算</h1>
            <div class="row">
                <label>输入金额</label>
                <input id="num" type="number" placeholder="输入金额">
            </div>
            <div class="row">
                <label>换算类型</label>
                <select id="type">
                    <option value="rmb2usd">人民币(CNY) → 美元(USD)</option>
                    <option value="usd2rmb">美元(USD) → 人民币(CNY)</option>
                </select>
            </div>
            <div class="row">
                <label>自定义汇率</label>
                <input id="rate" type="number" step="0.0001" value="7.2">
                <div class="tip">⚠️可手动修改，仅用于卖家粗略估算，非实时银行牌价</div>
            </div>
            <div id="result">换算结果将显示在这里</div>
        </div>
    </div>

<script>
function calc(){
    const n = parseFloat(document.getElementById('num').value);
    const t = document.getElementById('type').value;
    const rate = parseFloat(document.getElementById('rate').value);
    let res = "";
    if(isNaN(n) || isNaN(rate)){
        res = "请输入有效数字和汇率";
    }else{
        switch(t){
            case "rmb2usd": res = `${n} CNY = ${(n / rate).toFixed(2)} USD`;break;
            case "usd2rmb": res = `${n} USD = ${(n * rate).toFixed(2)} CNY`;break;
        }
    }
    document.getElementById("result").innerText = res;
}
document.getElementById('num').oninput = calc;
document.getElementById('type').onchange = calc;
document.getElementById('rate').oninput = calc;
</script>
</body>
</html>
