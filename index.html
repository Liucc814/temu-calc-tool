<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 移动端适配，手机打开正常显示 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temu跨境卖家工具 | 在线换算</title>
    <style>
        * {
            box-sizing: border-box;
            margin:0;
            padding:0;
            font-family:system-ui, sans-serif;
        }
        body {
            background-color:#f3f4f6;
            padding:30px 15px;
        }
        .container{
            max-width:700px;
            margin:0 auto;
        }
        h1{
            text-align:center;
            color:#1f2937;
            margin-bottom:40px;
        }
        .tool-card{
            background:#fff;
            padding:24px;
            border-radius:12px;
            margin-bottom:18px;
            box-shadow:0 2px 8px rgba(0,0,0,0.08);
        }
        .tool-card h2{
            color:#2563eb;
            margin-bottom:8px;
        }
        .tool-card p{
            color:#4b5563;
            margin-bottom:12px;
        }
        .tool-card a{
            display:inline-block;
            padding:10px 18px;
            background:#2563eb;
            color:#fff;
            text-decoration:none;
            border-radius:8px;
        }
        .notice{
            margin-top:40px;
            font-size:14px;
            color:#6b7280;
            border:1px solid #ddd;
            padding:16px;
            border-radius:8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Temu跨境卖家换算工具箱</h1>

        <div class="tool-card">
            <h2>重量换算 g ↔ lb / oz</h2>
            <p>克、千克、磅、盎司快速转换，适合包裹称重</p>
            <a href="weight.html">打开工具</a>
        </div>

        <div class="tool-card">
            <h2>尺寸换算 cm ↔ inch</h2>
            <p>厘米英寸转换，商品尺寸、纸箱尺寸计算</p>
            <a href="size.html">打开工具</a>
        </div>

        <div class="tool-card">
            <h2>材积重（体积重）计算器</h2>
            <p>跨境物流体积重计算，对比实际重量</p>
            <a href="volumetric.html">打开工具</a>
        </div>

        <div class="tool-card">
            <h2>货币换算</h2>
            <p>人民币美元欧元，自定义汇率（仅估算参考）</p>
            <a href="currency.html">打开工具</a>
        </div>

        <div class="notice">
            ⚠️免责声明：本工具所有计算结果仅作为跨境卖家估算参考，不可作为物流结算、财务对账正式依据。
        </div>
    </div>
</body>
</html>
