<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><span class="lang zh">跨境电商单位换算工具 | 首页</span><span class="lang en" style="display:none">Cross-border Unit Converter | Home</span></title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, sans-serif;
        }
        body {
            background-color: #f3f4f6;
            padding:30px 15px;
        }
        .container{
            max-width:600px;
            margin:0 auto;
        }
        .card{
            background:#fff;
            padding:24px;
            border-radius:12px;
            box-shadow:0 1px 3px #0000001a;
        }
        h1{
            text-align:center;
            margin-bottom:24px;
        }
        .menu-item{
            display:block;
            text-align:center;
            padding:14px;
            margin:12px 0;
            background:#2563eb;
            color:#fff;
            text-decoration:none;
            border-radius:8px;
            font-size:17px;
        }
        .menu-item:hover{
            background:#1d4ed8;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <!-- 语言切换 -->
        <div style="margin-bottom:20px;text-align:center;">
            <button onclick="switchLang('zh')">中文</button>
            <button onclick="switchLang('en')">English</button>
        </div>

        <h1>
            <span class="lang zh">跨境电商换算工具</span>
            <span class="lang en" style="display:none">Cross-border E-commerce Tool</span>
        </h1>

        <a href="./weight.html" class="menu-item">
            <span class="lang zh">重量换算 g ↔ lb</span>
            <span class="lang en" style="display:none">Weight Converter g ↔ lb</span>
        </a>
        <a href="./size.html" class="menu-item">
            <span class="lang zh">尺寸换算 cm ↔ inch</span>
            <span class="lang en" style="display:none">Size Converter cm ↔ inch</span>
        </a>
        <a href="./volumetric.html" class="menu-item">
            <span class="lang zh">体积重计算</span>
            <span class="lang en" style="display:none">Volumetric Weight</span>
        </a>
        <a href="./currency.html" class="menu-item">
            <span class="lang zh">货币估算 CNY ↔ USD</span>
            <span class="lang en" style="display:none">Currency Estimate CNY ↔ USD</span>
        </a>
    </div>
</div>

<script>
let currentLang = "en";
function switchLang(lang) {
    currentLang = lang;
    localStorage.setItem("webLang", lang);
    document.querySelectorAll(".lang").forEach(el => {
        el.style.display = el.classList.contains(lang) ? "inline" : "none";
    });
    document.querySelectorAll(".trans-placeholder").forEach(input => {
        input.placeholder = input.dataset[lang];
    });
}
window.onload = function () {
  const savedLang = localStorage.getItem("webLang");
  if(savedLang){
    currentLang = savedLang;
  }
  switchLang(currentLang);
}
</script>
</body>
</html>
