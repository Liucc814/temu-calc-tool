<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>材积重计算器 | Temu跨境卖家工具</title>
    <style>
        * {
            box-sizing: border-box;
            margin:0;
            padding:0;
            font-family:system-ui, sans-serif;
        }
        body {
            background-color:#f3f4f6;
            padding:30px 15px;
        }
        .container{
            max-width:600px;
            margin:0 auto;
        }
        .back{
            margin-bottom:20px;
        }
        .back a{
            color:#2563eb;
            text-decoration:none;
        }
        .card{
            background:#fff;
            padding:24px;
            border-radius:12px;
            box-shadow:0 2px 8px rgba(0,0,0,0.08);
        }
        h1{
            text-align:center;
            color:#1f2937;
            margin-bottom:24px;
            font-size:22px;
        }
        .row{
            margin:16px 0;
        }
        label{
            display:block;
            margin-bottom:6px;
            color:#444;
        }
        input,select{
            width:100%;
            padding:10px;
            font-size:16px;
            border:1px solid #ccc;
            border-radius:6px;
        }
        #result{
            margin-top:20px;
            padding:14px;
            background:#f0f7ff;
            border-radius:8px;
            font-size:17px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="back">
            <a href="index.html">← 返回工具箱首页</a>
        </div>
        <div class="card">
            <h1>材积重（体积重）计算器</h1>
            <div class="row">
                <label>长 cm</label>
                <input id="length" type="number" placeholder="包裹长度">
            </div>
            <div class="row">
                <label>宽 cm</label>
                <input id="width" type="number" placeholder="包裹宽度">
            </div>
            <div class="row">
                <label>高 cm</label>
                <input id="height" type="number" placeholder="包裹高度">
            </div>
            <div class="row">
                <label>实际重量 kg</label>
                <input id="realWeight" type="number" placeholder="包裹实际称重">
            </div>
            <div class="row">
                <label>材积系数（Temu常用：5000）</label>
                <input id="divisor" type="number" value="5000">
            </div>
            <div id="result">结果将显示在这里</div>
        </div>
    </div>

<script>
function calc(){
    const l = parseFloat(document.getElementById('length').value);
    const w = parseFloat(document.getElementById('width').value);
    const h = parseFloat(document.getElementById('height').value);
    const realW = parseFloat(document.getElementById('realWeight').value);
    const divisor = parseFloat(document.getElementById('divisor').value);
    let res = "";

    if(isNaN(l) || isNaN(w) || isNaN(h) || isNaN(divisor)){
        res = "请输入长宽高和材积系数";
    }else{
        const volumeWeight = (l * w * h) / divisor;
        res = `体积重：${volumeWeight.toFixed(3)} kg\n`;
        if(!isNaN(realW)){
            const billWeight = Math.max(volumeWeight, realW);
            res += `实际重量：${realW.toFixed(3)} kg\n`;
            res += `计费重取较大值：${billWeight.toFixed(3)} kg`;
        }else{
            res += `未填写实际重量，仅算出体积重`;
        }
    }
    document.getElementById("result").innerText = res;
}
document.getElementById('length').oninput = calc;
document.getElementById('width').oninput = calc;
document.getElementById('height').oninput = calc;
document.getElementById('realWeight').oninput = calc;
document.getElementById('divisor').oninput = calc;
</script>
</body>
</html>
