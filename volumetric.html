<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><span class="lang zh">体积重计算器 | Temu跨境卖家工具</span><span class="lang en" style="display:none">Volumetric Weight | Cross-border Seller Tool</span></title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, sans-serif;
        }
        body {
            background-color: #f3f4f6;
            padding:30px 15px;
        }
        .container{
            max-width:600px;
            margin:0 auto;
        }
        .back{
            margin-bottom:20px;
        }
        .back a{
            color:#2563eb;
            text-decoration:none;
        }
        .card{
            background:#fff;
            padding:24px;
            border-radius:12px;
            box-shadow:0 1px 3px #0000001a;
        }
        .row{
            margin:16px 0;
        }
        label{
            display:block;
            margin-bottom:6px;
        }
        input{
            width:100%;
            padding:10px;
            border:1px solid #ddd;
            border-radius:6px;
            font-size:16px;
        }
        #result{
            margin-top:20px;
            font-size:18px;
            font-weight:bold;
        }
        .tip{
            color:#666;
            font-size:14px;
            margin-top:6px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="back">
        <a href="./index.html">
            <span class="lang zh">← 返回首页</span>
            <span class="lang en" style="display:none">← Back Home</span>
        </a>
    </div>
    <div style="margin-bottom:20px;">
        <button onclick="switchLang('zh')">中文</button>
        <button onclick="switchLang('en')">English</button>
    </div>
    <div class="card">
        <h1>
            <span class="lang zh">体积重计算 (cm)</span>
            <span class="lang en" style="display:none">Volumetric Weight (cm)</span>
        </h1>
        <p class="tip">
            <span class="lang zh">体积重=长×宽×高 / 6000</span>
            <span class="lang en" style="display:none">Vol Wt = L×W×H / 6000</span>
        </p>

        <div class="row">
            <label>
                <span class="lang zh">长 cm</span>
                <span class="lang en" style="display:none">Length cm</span>
            </label>
            <input type="number" class="trans-placeholder" id="l" data-zh="输入长度" data-en="Input length">
        </div>
        <div class="row">
            <label>
                <span class="lang zh">宽 cm</span>
                <span class="lang en" style="display:none">Width cm</span>
            </label>
            <input type="number" class="trans-placeholder" id="w" data-zh="输入宽度" data-en="Input width">
        </div>
        <div class="row">
            <label>
                <span class="lang zh">高 cm</span>
                <span class="lang en" style="display:none">Height cm</span>
            </label>
            <input type="number" class="trans-placeholder" id="h" data-zh="输入高度" data-en="Input height">
        </div>
        <div id="result">
            <span class="lang zh">体积重：</span>
            <span class="lang en" style="display:none">Volumetric Weight:</span>
            <span id="numPart"></span>
        </div>
    </div>
</div>

<script>
const l = document.getElementById('l');
const w = document.getElementById('w');
const h = document.getElementById('h');
const numPart = document.getElementById('numPart');

function calcVol(){
    let L = Number(l.value);
    let W = Number(w.value);
    let H = Number(h.value);
    if(!isNaN(L) && !isNaN(W) && !isNaN(H) && L>0 && W>0 && H>0){
        let volWt = (L * W * H) / 6000;
        numPart.innerText = volWt.toFixed(3)+" kg";
    }else{
        numPart.innerText = "";
    }
}
l.oninput=calcVol;
w.oninput=calcVol;
h.oninput=calcVol;

let currentLang = "en";
function switchLang(lang) {
    currentLang = lang;
    localStorage.setItem("webLang", lang);
    document.querySelectorAll(".lang").forEach(el => {
        el.style.display = el.classList.contains(lang) ? "inline" : "none";
    });
    document.querySelectorAll(".trans-placeholder").forEach(input => {
        input.placeholder = input.dataset[lang];
    });
}
window.onload = function () {
  const savedLang = localStorage.getItem("webLang");
  if(savedLang){
    currentLang = savedLang;
  }
  switchLang(currentLang);
}
</script>
</body>
</html>
