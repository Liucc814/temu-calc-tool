<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><span class="lang zh">尺寸换算 | Temu跨境卖家工具</span><span class="lang en" style="display:none">Size Converter | Cross-border Seller Tool</span></title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, sans-serif;
        }
        body {
            background-color: #f3f4f6;
            padding:30px 15px;
        }
        .container{
            max-width:600px;
            margin:0 auto;
        }
        .back{
            margin-bottom:20px;
        }
        .back a{
            color:#2563eb;
            text-decoration:none;
        }
        .card{
            background:#fff;
            padding:24px;
            border-radius:12px;
            box-shadow:0 1px 3px #0000001a;
        }
        .row{
            margin:16px 0;
        }
        label{
            display:block;
            margin-bottom:6px;
        }
        input{
            width:100%;
            padding:10px;
            border:1px solid #ddd;
            border-radius:6px;
            font-size:16px;
        }
        #result{
            margin-top:20px;
            font-size:18px;
            font-weight:bold;
        }
        .tip{
            color:#666;
            font-size:14px;
            margin-top:6px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="back">
        <a href="./index.html">
            <span class="lang zh">← 返回首页</span>
            <span class="lang en" style="display:none">← Back Home</span>
        </a>
    </div>
    <div style="margin-bottom:20px;">
        <button onclick="switchLang('zh')">中文</button>
        <button onclick="switchLang('en')">English</button>
    </div>
    <div class="card">
        <h1>
            <span class="lang zh">尺寸换算 cm ↔ inch</span>
            <span class="lang en" style="display:none">Size Conversion cm ↔ inch</span>
        </h1>
        <p class="tip">
            <span class="lang zh">1英寸(inch) = 2.54厘米(cm)</span>
            <span class="lang en" style="display:none">1 inch = 2.54 cm</span>
        </p>

        <div class="row">
            <label>
                <span class="lang zh">输入厘米(cm)</span>
                <span class="lang en" style="display:none">Enter Centimeter(cm)</span>
            </label>
            <input type="number" class="trans-placeholder" id="cm" data-zh="请输入厘米数值" data-en="Input cm value">
        </div>
        <div class="row">
            <label>
                <span class="lang zh">输入英寸(inch)</span>
                <span class="lang en" style="display:none">Enter Inch(inch)</span>
            </label>
            <input type="number" class="trans-placeholder" id="inch" data-zh="请输入英寸数值" data-en="Input inch value">
        </div>
        <div id="result">
            <span class="lang zh">换算结果：</span>
            <span class="lang en" style="display:none">Result:</span>
            <span id="numPart"></span>
        </div>
    </div>
</div>

<script>
const cmInput = document.getElementById('cm');
const inchInput = document.getElementById('inch');
const numPart = document.getElementById('numPart');

cmInput.oninput = function(){
    let cm = Number(this.value);
    if(!isNaN(cm) && cm>0){
        let res = cm / 2.54;
        inchInput.value = res.toFixed(4);
        numPart.innerText = `${cm} cm = ${res.toFixed(4)} inch`;
    }else{
        inchInput.value = '';
        numPart.innerText = '';
    }
}
inchInput.oninput = function(){
    let inch = Number(this.value);
    if(!isNaN(inch) && inch>0){
        let res = inch * 2.54;
        cmInput.value = res.toFixed(2);
        numPart.innerText = `${inch} inch = ${res.toFixed(2)} cm`;
    }else{
        cmInput.value = '';
        numPart.innerText = '';
    }
}

let currentLang = "en";
function switchLang(lang) {
    currentLang = lang;
    localStorage.setItem("webLang", lang);
    document.querySelectorAll(".lang").forEach(el => {
        el.style.display = el.classList.contains(lang) ? "inline" : "none";
    });
    document.querySelectorAll(".trans-placeholder").forEach(input => {
        input.placeholder = input.dataset[lang];
    });
}
window.onload = function () {
  const savedLang = localStorage.getItem("webLang");
  if(savedLang){
    currentLang = savedLang;
  }
  switchLang(currentLang);
}
</script>
</body>
</html>
