<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>尺寸换算 | Temu跨境卖家工具</title>
    <style>
        * {
            box-sizing: border-box;
            margin:0;
            padding:0;
            font-family:system-ui, sans-serif;
        }
        body {
            background-color:#f3f4f6;
            padding:30px 15px;
        }
        .container{
            max-width:600px;
            margin:0 auto;
        }
        .back{
            margin-bottom:20px;
        }
        .back a{
            color:#2563eb;
            text-decoration:none;
        }
        .card{
            background:#fff;
            padding:24px;
            border-radius:12px;
            box-shadow:0 2px 8px rgba(0,0,0,0.08);
        }
        h1{
            text-align:center;
            color:#1f2937;
            margin-bottom:24px;
            font-size:22px;
        }
        .row{
            margin:16px 0;
        }
        label{
            display:block;
            margin-bottom:6px;
            color:#444;
        }
        input,select{
            width:100%;
            padding:10px;
            font-size:16px;
            border:1px solid #ccc;
            border-radius:6px;
        }
        #result{
            margin-top:20px;
            padding:14px;
            background:#f0f7ff;
            border-radius:8px;
            font-size:17px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="back">
            <a href="index.html">← 返回工具箱首页</a>
        </div>
        <div class="card">
            <h1>尺寸换算 cm ↔ inch</h1>
            <div class="row">
                <label>输入数值</label>
                <input id="num" type="number" placeholder="例如 20">
            </div>
            <div class="row">
                <label>换算类型</label>
                <select id="type">
                    <option value="cm2inch">厘米(cm) → 英寸(inch)</option>
                    <option value="inch2cm">英寸(inch) → 厘米(cm)</option>
                </select>
            </div>
            <div id="result">换算结果将显示在这里</div>
        </div>
    </div>

<script>
function calc(){
    const n = parseFloat(document.getElementById('num').value);
    const t = document.getElementById('type').value;
    let res = "";
    if(isNaN(n)){
        res = "请输入有效数字";
    }else{
        switch(t){
            case "cm2inch": res = `${n} cm = ${(n/2.54).toFixed(4)} inch`;break;
            case "inch2cm": res = `${n} inch = ${(n*2.54).toFixed(2)} cm`;break;
        }
    }
    document.getElementById("result").innerText = res;
}
document.getElementById('num').oninput = calc;
document.getElementById('type').onchange = calc;
</script>
</body>
</html>
